  - "ta de\t他的 她的 它的"
  - "na ge\t那个 哪个"
  - "na li\t那里 哪里"
  - "na xie\t那些 哪些"

english_words_demoter_filter:            # 降低英文词优先级配置
  mode:                          # 模式设定：all (全面降低) | none (不降低) | custom (仅 words 定义的)
  idx: 2                         # 将匹配的英文词降低到第几个候选项之后
  words:                         # 在 custom 模式下生效的单词列表

corrector_filter:                # 错音错字纠偏 Lua 配置
  keep_source_comment: false     # 如果没触发纠偏，是否显示原本的拼音注释
  style: "[{comment}]"           # 纠偏提示的显示样式，{comment} 为占位符

melt_eng:                        # 英文输入模块配置 (集成 melt_eng)
  dictionary: melt_eng           # 使用的英文词库名
  enable_sentence: false         # 禁用英文自动造句
  enable_completion: false       # 禁用英文补全提示
  enable_user_dict: false        # 禁用英文用户词库，防止用户输入污染词频
  initial_quality: 1.1           # 初始权重，略高于中文以在明确匹配时前排显示
  comment_format:                # 定义备注显示格式
    - xform/.*//                 # 清空默认备注，保持候选栏清爽

cn_en:                           # 中英混输模块配置
  dictionary: ""                 # 词库名，此处直接通过 user_dict 引用文本文件
  user_dict: dicts/rime_ice.cn_en # 用户词库文件路径
  db_class: stabledb             # 数据库类，stabledb 为只读
  enable_completion: true        # 开启补全提示，提升中英混输联想能力
  enable_sentence: false         # 禁用自动造句
  initial_quality: 0.5           # 权重设定，避免过度干扰主拼音候选
  comment_format:                # 备注格式处理
    - xform/^.+$//               # 隐藏所有备注

# -----------------------------------------------------------------------------
# 主拼音翻译器配置 (Main Translator)
# -----------------------------------------------------------------------------
translator:
  dictionary: rome               # 主词库名，引用同名的 .dict.yaml 文件
  enable_word_completion: true   # 对长词启用自动补全（需 librime 版本支持）
  spelling_hints: 8              # 拼写提示长度，便于 corrector_filter 获取完整拼音
  always_show_comments: true     # 始终显示拼音注释，这是 Lua 纠偏脚本运行的前提
  comment_format:                # 对候选词后的拼音注释进行修饰
    - xform/^/［/                # 在开头增加左方括号
    - xform/$/］/                # 在结尾增加右方括号
  preedit_format:                # 对上屏前的原始输入字符串进行变换（视觉美化）
    - xform/([nl])v/$1ü/         # 纠正 v 的显示为 ü
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
    - xform/(?<=[A-Z])\s(?=[A-Z])// # 消除大写字母间的空格
  initial_quality: 1.2           # 主翻译器的初始权重
  enable_user_dict: true         # 用户词库，实现动态调频和动态造词

# -----------------------------------------------------------------------------
# 拼写规则与变换 (Speller & Algebra)
# -----------------------------------------------------------------------------
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA # 输入允许的字符集，包含大小写以支持中英混输
  delimiter: " `"                # 分隔符定义：首位空格为音节分隔，次位反引号为手动切词符
  algebra:                       # 拼写运算：定义拼音输入到词库编码的映射与变换逻辑
    - erase/^xx$/                # 删除特定内部编码（如首选保留位）
    ### 核心功能音节修正
    - erase/^hm$/                # 移除单音节占位符，以便简拼匹配
    - erase/^m$/ 
    - erase/^n$/ 
    - erase/^ng$/ 
    ### 模糊音方案 (Fuzzy Pinyin)
    - derive/([aeiou])ng$/$1gn/  # 支持手抖输入：dang -> dagn
    ## 简拼与缩写生成 logic (Abbreviation)
    # - derive/^([a-z]).+$/$1/     # [已注释] 移除首字母简拼的强制派生，降低简拼权重，实现全拼优先
    # - derive/^([zcs]h).+$/$1/     # [已注释] 移除 zh/ch/sh 简拼派生
    - abbrev/^([a-z]).+$/$1/     # 将首字母作为正式简拼缩写
    - abbrev/^([a-z]{2,}).+$/$1/ # 允许使用音节的前两个字母作为缩写（如 zenme -> zem）
    ### 万能纠错规则 (Auto Correction)
    # 本部分规则自动处理常见的字母换位和拼错情况
    - derive/([zcs])h(a|e|i|u|ai|ei|an|en|ou|uo|ua|un|ui|uan|uai|uang|ang|eng|ong)$/h$1$2/ # hzi -> zhi
    - derive/([zcs])h([aeiu])$/$1$2h/ # zih -> zhi
    - derive/^([wghk])ai$/$1ia/   # wia -> wai
    - derive/([qjx])ia$/$1ai/     # qai -> qia
    - derive/([wtfghkz])ei$/$1ie/ # ie -> ei 转换
    - derive/([jqx])ie$/$1ei/
    - derive/([rtypsdghklzcbnm])ao$/$1oa/ # ao -> oa
    - derive/([ypfm])ou$/$1uo/    # ou -> uo
    - derive/([wrtypsdfghklzcbnm])an$/$1na/ # an -> na
    - derive/([wrpsdfghklzcbnm])en$/$1ne/ # en -> ne
    - derive/([wrtypsdfghklzcbnm])ang$/$1nag/ # ang -> nag
    - derive/([wrtypsdfghklzcbnm])ang$/$1agn/ # ang -> agn
    - derive/([wrtpsdfghklzcbnm])eng$/$1neg/
    - derive/([wrtpsdfghklzcbnm])eng$/$1egn/
    - derive/([qtypdjlxbnm])ing$/$1nig/
    - derive/([qtypdjlxbnm])ing$/$1ign/
    - derive/([rtysdghklzcn])ong$/$1nog/
    - derive/([rtysdghklzcn])ong$/$1ogn/
    - derive/([qtpdjlxbnm])iao$/$1ioa/
    - derive/([qtpdjlxbnm])iao$/$1oia/
    - derive/([rtsghkzc])ui$/$1iu/ # ui -> iu
    - derive/([qjlxnm])iu$/$1ui/   # iu -> ui
    - derive/([qtpdjlxbnm])ian$/$1ain/
    - derive/([qypjlxnm])in$/$1ni/
    - derive/([qjlxn])iang$/$1aing/
    - derive/([qjlxn])iang$/$1inag/
    - derive/([g|k|h|zh|sh])ua$/$1au/
    - derive/([g|h|k|zh|ch|sh])uai$/$1aui/
    - derive/([g|h|k|zh|ch|sh])uai$/$1uia/
    - derive/([qrtysdghjklzxcn])uan$/$1aun/
    - derive/([qrtysdghjklzxc])un$/$1nu/
    - derive/([nlyjqx])ue$/$1eu/
    - derive/([nl])ve/$1ue/       # 适配 üe/ve 输入
    - derive/([g|h|k|zh|ch|sh])uang$/$1aung/
    - derive/([g|h|k|zh|ch|sh])uang$/$1uagn/
    - derive/([g|h|k|zh|ch|sh])uang$/$1unag/
    - derive/([g|h|k|zh|ch|sh])uang$/$1augn/
    - derive/([jqx])iong$/$1inog/
    - derive/([jqx])iong$/$1oing/
    - derive/([jqx])iong$/$1iogn/
    - derive/([jqx])iong$/$1oign/
    ### 通用拼写特征合并
    - derive/([rtsdghkzc])o(u|ng)$/$1o/ # do -> dou|dong 聚合
    - derive/ong$/on/             # 支持连打拼写：lon -> long
    - derive/([tl])eng$/$1en/     # 支持连打拼写：ten -> teng
    - derive/([qwrtypsdfghjklzxcbnm])([aeio])ng$/$1ng/ # 通配：lng -> lang/leng/ling/long
    - derive/un$/ong/             # 方言/口音映射支持

# -----------------------------------------------------------------------------
# 反查与辅助映射 (Reverse Lookup & Patterns)
# -----------------------------------------------------------------------------
reverse_lookup:                  # 反查功能（通常用于笔画或拆字反查拼音）
  overwrite_comment: true        # 用反查出的拼音覆盖原有的备注
  dictionary: dicts/frost.8105   # 反查所依赖的基础字库

editor:                          # 编辑器行为定义：按键对应的操作
  bindings:
    space: confirm               # 空格：上屏选中的候选词
    Return: commit_raw_input     # 回车：上屏当前输入的字母原型
    Control+Return: commit_script_text # Ctrl+回车：上屏经过变换后的拼音
    Control+Shift+Return: commit_comment # Ctrl+Shift+回车：直接上屏候选词后的备注信息
    BackSpace: revert            # 退格：回滚上一次拼音输入
    Delete: delete               # Delete：向后删除字符
    Control+BackSpace: back_syllable # Ctrl+退格：向后删除一整个音节
    Control+Delete: delete_candidate # Ctrl+Delete：删除当前高亮候选词（支持同步删除用户词库词频）
    Escape: cancel               # Esc：取消当前输入，清空编码栏

punctuator:                      # 标点符号映射
  import_preset: symbols         # 导入外部 symbols.yaml 符号预设

recognizer:                      # 输入码模式识别，决定何时触发特定 Translator/Lua
  import_preset: default         # 导入默认预设
  patterns:
    url: "^[a-z]+[.].+$"         # 识别网址模式
    punct: "^/([0-9]0?|[a-zA-Z]+)$" # 识别以 / 开头的快捷符号输入
    radical_lookup: "Uu[a-z]*'?$" # 识别 U 开头的拆字/部首反查
    rmb: "^R[0-9]+[.]?[0-9]*"    # 识别 R 开头的数字转大写金额模式
    expression: "^=.*$"           # 识别 = 开头的计算器公式模式
    lunar_cmd: "lunar"           # 识别关键字输入以显示农历日期
    gregorian_to_lunar: "^N[0-9]{1,8}" # 识别 N 开头的日期转换模式（如 N20240218）
    uppercase: ""                # 覆写默认大写映射，增强大写字母后的数字连打支持

# -----------------------------------------------------------------------------
# 全局快捷键绑定 (Global Key Binder)
# -----------------------------------------------------------------------------
key_binder:
  bindings:
    # 使用 Control+Shift 组合键切换各种输入法状态
    - { when: always, accept: "Control+Shift+E", toggle: emoji } # 切换 Emoji 显隐
    - { when: always, accept: Control+Shift+1, select: .next } # 循环切换输入方案
    - { when: always, accept: Control+Shift+2, toggle: ascii_mode } # 切换中英文模式
    - { when: always, accept: Control+Shift+3, toggle: full_shape } # 切换全半角模式
    - { when: always, accept: Shift+space, toggle: full_shape }     # Shift+空格切换全半角
    - { when: always, accept: Control+Shift+4, toggle: traditionalization } # 切换简繁体转换
    - { when: always, accept: Control+Shift+5, toggle: extended_charset } # 切换扩展字符集
    - { when: always, accept: Control+period, toggle: ascii_punct } # Ctrl+句号切换中英标点
    - { when: has_menu, accept: "Control+Shift+T", toggle: traditionalization } # 候选时切换简繁

    # 翻页键位映射
    - { when: paging, accept: minus, send: Page_Up }   # 减号向前翻页
    - { when: paging, accept: comma, send: Page_Up }   # 逗号向前翻页
    - { when: has_menu, accept: equal, send: Page_Down } # 等号向后翻页
    - { when: has_menu, accept: period, send: Page_Down } # 句号向后翻页

    # 联想/预测模式下的按键处理
    - { when: predicting, accept: comma, send: comma } # 联想状态下支持逗号上屏
    - { when: predicting, accept: period, send: period } # 联想状态下支持句号上屏

# -----------------------------------------------------------------------------
# 语言模型配置 (Language Model)
# 需确保 librime-octagram 插件已安装，并下载对应 .gram 文件至根据目录
# -----------------------------------------------------------------------------
grammar:
  language: zh-hans-t-essay-tgw   # 语言模型数据文件，使用三元模型 (tgw) 以获得更精准的上下文预测
  collocation_max_length: 5     # 匹配上下文的最大长度（建议 3-5）
