# Rime 方案定义: 若木音 (rome)
# 本方案是一个高度定制化的全拼输入方案，融合了白霜拼音词库与雾凇拼音的功能特性。
# 架构设计上采用了 “核心引擎 + 外部词库脚本 + Lua 插件” 的模式。

schema:
  schema_id: rome                # 方案内部 ID，需与文件名 rome.schema.yaml 对应
  name: 若木音                   # 菜单中显示的方案名称
  version: "2025.05"             # 方案版本号
  dependencies:                  # 定义方案依赖，此处依赖英文方案以实现词典导入
    - melt_eng                   # 依赖 melt_eng (英文联想)

menu:
  page_size: 6                   # 每页显示的候选词数量，建议设为 5-9 之间以保持视觉舒适

switches:                        # 状态开关定义，可通过快捷键或菜单切换
  - name: ascii_mode             # 中英文切换开关
    states: ["中", "En"]         # 状态标签
    reset: 0                     # 初始状态：0 为中文模式
  - name: ascii_punct            # 中英文标点切换开关
    states: ["句读", "punct"]    # 状态标签
    reset: 1                     # 初始状态：1 为半角标点
  - name: traditionalization     # 简繁转换开关
    states: ["简", "繁"]         # 状态标签
    reset: 0                     # 初始状态：0 为简体
  - name: emoji                  # Emoji 候选开关
    states: ["❌", "✅"]          # 状态标签
    reset: 1                     # 初始状态：1 为开启 Emoji
  - name: full_shape             # 全半角开关
    states: ["弦", "盈"]         # 状态标签
    reset: 0                     # 初始状态：0 为半角

# -----------------------------------------------------------------------------
# 核心引擎 (Engine) 流程解析：
# 1. Processors: 处理按键输入，决定是否接收按键并传递给后续组件
# 2. Segmentors: 将输入字符串划分为不同的段落（如拼音、URL、标点等）
# 3. Translators: 将分段后的码转换成候选词（查表、Lua 动态生成等）
# 4. Filters: 对候选词列表进行后处理（去重、排序、转换、纠错提示等）
# -----------------------------------------------------------------------------
engine:
  processors:
    - lua_processor@*select_character_processor # Lua 处理器：实现“以词定字”功能
    - ascii_composer             # 处理西文模式及中西文切换
    - recognizer                 # 与 matcher 搭配，识别正则模式（如 URL、计算器等）
    - key_binder                 # 按键绑定处理器，处理常用快捷键
    - speller                    # 拼写处理器，接收字母按键
    - punctuator                 # 标点处理器
    - grammar                    # 语言模型处理器：基于上下文调整候选词权重
    - selector                   # 候选词选择处理器
    - navigator                  # 光标移动处理器
    - express_editor             # 表达式编辑器，支持回车确认等行为
  segmentors:
    - ascii_segmentor            # 标识西文段落
    - matcher                    # 标识符合正则规则的段落（如网址、反查、计算器）
    - abc_segmentor              # 标识常规的文字/拼音段落
    - punct_segmentor            # 标识句读/标点段落
    - fallback_segmentor         # 标识其他未被捕获的段落
  translators:
    - punct_translator           # 转换标点符号
    - script_translator          # 核心拼音翻译器（主词库）
    - lua_translator@*date_time_translator # Lua 翻译器：输出当前日期、时间、星期
    - lua_translator@*number_translator         # Lua 翻译器：将数字转换为金额大写、罗马数字等
    - lua_translator@*lunar_translator # Lua 翻译器：农历信息支持
    - lua_translator@*calculator_translator     # Lua 翻译器：简易计算器功能
    - table_translator@melt_eng  # 码表翻译器：中文模式下的英文输入建议
    - table_translator@cn_en     # 码表翻译器：中英混合词汇/短语
    - reverse_lookup_translator  # 反查翻译器
    # - lua_translator@*force_gc   # [已移除] 强制执行垃圾回收，控制内存占用
    - echo_translator            # 无候选词时，回显输入字符
  filters:
    - lua_filter@*corrector_filter       # Lua 过滤器：错音错字纠偏提示（如输入 "geiyu" 提示 "给予[jǐ yǔ]"）
    - lua_filter@*english_autocap_filter         # Lua 过滤器：英文首字母自动大写
    - lua_filter@*pinned_candidates_filter        # Lua 过滤器：用户自定义固定位候选词
    - lua_filter@*long_word_filter       # Lua 过滤器：长词优先策略，优化输入体验
    - lua_filter@*english_words_demoter_filter   # Lua 过滤器：降低低频或干扰性英文词汇的权重
    - simplifier@emoji                   # 转换器：实现 Emoji 候选项叠加
    - simplifier@traditionalize          # 转换器：简繁体即时转换
    - uniquifier                         # 过滤器：对最终候选列表进行去重

# -----------------------------------------------------------------------------
# 功能组件详细配置 (Components Configuration)
# -----------------------------------------------------------------------------

traditionalize:                  # 简繁转换配置
  option_name: traditionalization # 对应 switches 中的开关名
  opencc_config: s2t.json        # OpenCC 转换方案配置文件
  tips: none                     # 转换提示：all 全部显示 | char 仅单字显示 | none 不显示
  tags: [abc, number, gregorian_to_lunar] # 作用范围标签

emoji:                           # Emoji 叠加配置
  opencc_config: emoji.json      # Emoji 码表配置文件
  option_name: emoji             # 对应 switches 中的开关名
  tips: all                      # 显示对应词汇的 Emoji 提示
  inherit_comment: false         # 是否继承原有的注释内容

long_word_filter:                # 长词优先 Lua 配置
  count: 2                       # 每次输入最多提升多少个长词的优先级
  idx: 4                         # 将选出的长词插入到候选列表的第几个位置（从 1 开始计）

pinned_candidates_filter:                 # 置顶候选项 Lua 配置 (格式: 编码 <Tab> 字词1 <Space> 字词2)
  - "d\t的 地 得"                # 常用单字母置顶
  - "l\t了 啦"
  - "s\t是 时"
  - "w\t我"
  - "t\t他 她 它"
  - "h\t和 或"
  - "a\t啊"
  - "o\t哦"
  - "n\t那 哪 拿"
  - "m\t吗 嘛"
  - "b\t吧 把"
  - "j\t及 将 即"
  - "k\t可"
  - "g\t个 各"
  - "f\t发 放"
  - "z\t在 再 自"
  - "c\t才 从"
  - "r\t让 人"
  - "e\t呃"
  - "x\t想 像 向"
  - "y\t与 于"
  - "p\t片 篇"
  - "de\t的 地 得"              # 常用全拼音节置顶
  - "le\t了"
  - "ta\t他 她 它"
  - "shi\t是 时 使"
  - "wo\t我"
  - "ni\t你"
  - "bu\t不"
  - "he\t和"
  - "zhe\t这 着"
  - "na\t那 哪 拿"
  - "ma\t吗 嘛 妈"
  - "ba\t把 吧"
  - "hao\t好"
  - "da\t大 打"
  - "lai\t来"
  - "qu\t去"
  - "dou\t都"
  - "dao\t到 倒"
  - "zai\t在 再"
  - "hui\t会"
  - "hai\t还"
  - "jiu\t就"
  - "you\t有 又 由"
  - "yao\t要"
  - "ye\t也"
  - "wei\t为"
  - "er\t而 儿 二"
  - "en\t嗯"
  - "dui\t对"
  - "zh\t这"                    # 简拼置顶
  - "dd\t等等"
  - "gg\t刚刚"
  - "hh\t哈哈"
  - "kk\t看看"
  - "xx\t想想 想象"
