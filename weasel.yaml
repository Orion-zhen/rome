# Weasel settings
# encoding: utf-8
#
# weasel[.custom].yaml 是小狼毫的前端配置文件，鼠须管对应 squirrel[.custom].yaml。
# 各平台皮肤字段并不完全一致；从 squirrel 迁移时，需要按 Weasel 支持的字段名调整。
#
# 注意：
# 1. 这个文件目前由 Weasel::UIStyleSettings 生成/维护，某些操作后可能会被重新排序。
# 2. patch 里的键会覆写 build/weasel.yaml 中对应的默认值。

customization:
  distribution_code_name: Weasel
  distribution_version: 0.17.4
  generator: "Weasel::UIStyleSettings"
  modified_time: "Tue Mar 24 09:28:54 2026"
  rime_version: 1.13.1
patch:
  # 界面样式。这里的字段会直接覆写小狼毫前端的 style 配置。

  # 候选项排列方向：stacked | linear | tabled
  "style/candidate_list_layout": linear

  # 亮色/暗色主题各自使用的配色方案。
  "style/color_scheme": dusk_wyrm
  "style/color_scheme_dark": solar_halo

  # 全局字体及大小。
  "style/comment_font_face": "Microsoft YaHei UI"
  "style/comment_font_point": 14
  "style/font_face": "Microsoft YaHei UI"
  "style/font_point": 15
  "style/label_font_face": Consolas
  "style/label_font_point": 15

  # 内嵌预编辑：true 为单行，false 为双行/分离显示。
  "style/inline_preedit": true

  # 面板布局参数。Weasel 使用 style/layout/*，而不是 squirrel.yaml 里的扁平 style 键。
  # round_corner 与 corner_radius 保持一致更稳妥。
  "style/layout/corner_radius": 10
  "style/layout/round_corner": 10
  # 预编辑与候选区之间的间距。
  "style/layout/spacing": 10

